<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>便利帖</title>
<style>
body{font-family:sans-serif;background:#0f172a;color:#f1f5f9;margin:0;padding:16px}
.wrap{max-width:640px;margin:0 auto}
h1{font-size:22px;margin:0 0 8px}
.sub{color:#94a3b8;margin:0 0 12px;line-height:1.5}
input,textarea{width:100%;box-sizing:border-box;background:#1e293b;color:#fff;border:1px solid #334155;border-radius:10px;padding:12px;font-size:16px}
textarea{min-height:180px;margin-top:8px}
.ok{margin:10px 0;color:#22c55e;font-weight:700;min-height:1.2em}
.item{background:#1e293b;border-radius:10px;padding:12px;margin-top:8px}
.item b{display:block;font-size:18px}
.item p{margin:6px 0 0;color:#cbd5e1;white-space:pre-wrap}
button{margin-top:8px;margin-right:8px;border:0;border-radius:8px;padding:10px 14px;background:#334155;color:#fff}
.green{background:#22c55e;color:#052e16;font-weight:700}
</style>
</head>
<body>
<div class="wrap">
<h1>📝 便利帖</h1>
<p class="sub">題名と本文を書くだけで自動保存します。</p>
<input id="title" placeholder="題名">
<textarea id="body" placeholder="ここに書く"></textarea>
<div class="ok" id="msg"> </div>
<button class="green" id="newbtn">新しいメモ</button>
<div id="list"></div>
</div>
<script>
const $=id=>document.getElementById(id);
let current=Date.now();
function load(){ try{ return JSON.parse(localStorage.getItem('easy-memos')||'[]'); }catch(e){ return []; } }
function saveAll(list){ localStorage.setItem('easy-memos', JSON.stringify(list)); }
function say(t){ $('msg').textContent=t; }
function autosave(){
  const title=$('title').value;
  const body=$('body').value;
  let list=load();
  const i=list.findIndex(n=>n.id===current);
  const note={id:current,title,body,t:Date.now()};
  if(i>=0) list[i]=note; else if(title||body) list.push(note);
  list=list.filter(n=>n.title||n.body);
  saveAll(list);
  draw();
  if(title||body) say('保存しました');
}
function openNote(n){
  current=n.id;
  $('title').value=n.title||'';
  $('body').value=n.body||'';
  say('開きました');
  window.scrollTo(0,0);
}
function draw(){
  const list=load().sort((a,b)=>b.t-a.t);
  $('list').innerHTML='';
  list.forEach(n=>{
    const d=document.createElement('div');
    d.className='item';
    const b=document.createElement('b'); b.textContent=n.title||'無題';
    const p=document.createElement('p'); p.textContent=n.body||'';
    const del=document.createElement('button'); del.textContent='消す';
    del.onclick=e=>{ e.stopPropagation(); saveAll(load().filter(x=>x.id!==n.id)); if(current===n.id){ current=Date.now(); $('title').value=''; $('body').value=''; } draw(); };
    d.onclick=()=>openNote(n);
    d.appendChild(b); d.appendChild(p); d.appendChild(del);
    $('list').appendChild(d);
  });
}
$('title').oninput=autosave;
$('body').oninput=autosave;
$('newbtn').onclick=()=>{ current=Date.now(); $('title').value=''; $('body').value=''; say('新しいメモ'); window.scrollTo(0,0); };
draw();
</script>
</body>
</html>
