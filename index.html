<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ファイル＆動画圧縮</title>
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<style>
body{font-family:sans-serif;background:#0f172a;color:#f1f5f9;margin:0;padding:16px}
.wrap{max-width:640px;margin:0 auto}
h1{font-size:22px}
.tab{display:flex;gap:8px;margin:12px 0}
.tab button{flex:1;padding:10px;border:0;border-radius:8px;background:#1e293b;color:#94a3b8}
.tab button.on{background:#6366f1;color:#fff}
.card{background:#1e293b;border-radius:12px;padding:16px}
.drop{border:2px dashed #334155;border-radius:10px;padding:24px;text-align:center}
button.main{width:100%;margin-top:12px;padding:12px;border:0;border-radius:8px;background:#6366f1;color:#fff;font-weight:700}
button.main:disabled{opacity:.5}
a.dl{display:none;margin-top:12px;padding:12px;border-radius:8px;background:#22c55e;color:#052e16;text-align:center;text-decoration:none;font-weight:700}
select,input{background:#0f172a;color:#fff;border:1px solid #334155;border-radius:6px;padding:6px}
.est{margin-top:10px;display:none}
.ok{color:#22c55e}
</style>
</head>
<body>
<div class="wrap">
<h1>📦 ファイル＆動画圧縮</h1>
<p>ブラウザ内だけで処理します</p>
<div class="tab"><button class="on" id="t1">ZIP</button><button id="t2">動画</button></div>
<div class="card">
<div id="p1">
<div class="drop" id="zdrop">ファイルをタップして選ぶ</div>
<input id="zin" type="file" multiple hidden>
<p id="zlist"></p>
<label>圧縮 <select id="zlv"><option value="1">最速</option><option value="6" selected>標準</option><option value="9">最高</option></select></label>
<p class="est" id="zest"></p>
<button class="main" id="zbtn" disabled>ZIPを作る</button>
</div>
<div id="p2" style="display:none">
<div class="drop" id="vdrop">動画をタップして選ぶ</div>
<input id="vin" type="file" accept="video/*,*/*" hidden>
<video id="vp" controls style="width:100%;display:none;margin-top:8px"></video>
<p>
解像度 <select id="vres"><option value="orig">元</option><option value="1080">1080p</option><option value="720" selected>720p</option><option value="480">480p</option><option value="360">360p</option></select>
画質 <select id="vq"><option value="high">高</option><option value="medium" selected>標準</option><option value="low">軽量</option></select>
</p>
<p class="est" id="vest"></p>
<button class="main" id="vbtn" disabled>動画を圧縮</button>
</div>
<a class="dl" id="dl" href="#">ダウンロード</a>
<p id="msg"></p>
</div>
</div>
<script>
const $=id=>document.getElementById(id);
let zfiles=[], vfile=null, vmeta={w:0,h:0,d:0}, ready='';
function fmt(n){if(n<1024)return n+' B'; if(n<1048576)return (n/1024).toFixed(1)+' KB'; return (n/1048576).toFixed(2)+' MB';}
function readyFile(blob,name){if(ready) URL.revokeObjectURL(ready); const b=new Blob([blob],{type:'application/octet-stream'}); ready=URL.createObjectURL(b); const a=$('dl'); a.href=ready; a.download=name; a.style.display='block'; a.textContent='⬇️ '+name+' を保存';}
$('t1').onclick=()=>{ $('t1').className='on'; $('t2').className=''; $('p1').style.display='block'; $('p2').style.display='none'; };
$('t2').onclick=()=>{ $('t2').className='on'; $('t1').className=''; $('p2').style.display='block'; $('p1').style.display='none'; };
$('zdrop').onclick=()=>$('zin').click();
$('zin').onchange=()=>{ zfiles=[...$('zin').files]; $('zlist').textContent=zfiles.map(f=>f.name).join(', '); $('zbtn').disabled=!zfiles.length; };
$('zbtn').onclick=async()=>{ const zip=new JSZip(); zfiles.forEach(f=>zip.file(f.name,f)); const blob=await zip.generateAsync({type:'blob',compression:'DEFLATE',compressionOptions:{level:+$('zlv').value}}); readyFile(blob,'compressed.zip'); $('msg').textContent='できました '+fmt(blob.size); };
$('vdrop').onclick=()=>$('vin').click();
$('vin').onchange=()=>{ const f=$('vin').files[0]; if(!f)return; vfile=f; const url=URL.createObjectURL(f); const v=$('vp'); v.src=url; v.style.display='block'; v.onloadedmetadata=()=>{ vmeta={w:v.videoWidth,h:v.videoHeight,d:v.duration||0}; $('vbtn').disabled=false; }; };
function sizeWH(w,h,mode){ if(mode==='orig'||h<=+mode) return {w,h}; const r=+mode/h; return {w:Math.max(2,Math.round(w*r/2)*2), h:Math.max(2,Math.round(+mode/2)*2)}; }
$('vbtn').onclick=async()=>{ if(!vfile||!window.MediaRecorder){ $('msg').textContent='このブラウザでは動画圧縮できません'; return;} const src=document.createElement('video'); src.muted=true; src.playsInline=true; src.src=URL.createObjectURL(vfile); await new Promise((ok,ng)=>{src.onloadedmetadata=ok; src.onerror=()=>ng(new Error('read'));}); const s=sizeWH(src.videoWidth,src.videoHeight,$('vres').value); const q=$('vq').value; const bits=Math.round(Math.max(.25,Math.min(12,(s.w*s.h)/(1280*720)*({high:2.4,medium:1.3,low:.7}[q])*2.2))*1e6); const c=document.createElement('canvas'); c.width=s.w; c.height=s.h; const ctx=c.getContext('2d'); const stream=c.captureStream(30); const mime=['video/webm;codecs=vp9,opus','video/webm;codecs=vp8,opus','video/webm'].find(t=>MediaRecorder.isTypeSupported(t))||'video/webm'; const rec=new MediaRecorder(stream,{mimeType:mime,videoBitsPerSecond:bits}); const ch=[]; rec.ondataavailable=e=>{if(e.data&&e.data.size)ch.push(e.data)}; const done=new Promise(r=>rec.onstop=r); rec.start(250); src.currentTime=0; await src.play(); const draw=()=>{ if(src.ended||src.paused)return; ctx.drawImage(src,0,0,s.w,s.h); requestAnimationFrame(draw);}; requestAnimationFrame(draw); await new Promise(r=>src.onended=r); ctx.drawImage(src,0,0,s.w,s.h); rec.stop(); await done; const blob=new Blob(ch,{type:'video/webm'}); readyFile(blob, vfile.name.replace(/\.[^.]+$/,'')+'_'+s.h+'p.webm'); $('msg').textContent='できました '+fmt(blob.size); };
</script>
</body>
</html>
