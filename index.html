<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ファイル圧縮と便利帖</title>
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<script src="https://unpkg.com/@ffmpeg/ffmpeg@0.11.6/dist/ffmpeg.min.js"></script>
<style>
body{font-family:sans-serif;background:#0f172a;color:#f1f5f9;margin:0;padding:16px}
.wrap{max-width:640px;margin:0 auto}
h1{font-size:22px;margin:0 0 6px}
.sub{color:#94a3b8;margin:0 0 12px;line-height:1.5}
.tab{display:flex;gap:6px;margin:12px 0}
.tab button{flex:1;padding:10px 6px;border:0;border-radius:8px;background:#1e293b;color:#94a3b8;font-size:14px}
.tab button.on{background:#6366f1;color:#fff}
.card{background:#1e293b;border-radius:12px;padding:16px}
.drop{border:2px dashed #334155;border-radius:10px;padding:22px;text-align:center}
button.main{width:100%;margin-top:10px;padding:12px;border:0;border-radius:8px;background:#6366f1;color:#fff;font-weight:700}
button.main:disabled{opacity:.5}
button.green{background:#22c55e;color:#052e16}
select,input,textarea{background:#0f172a;color:#fff;border:1px solid #334155;border-radius:6px;padding:8px;width:100%;box-sizing:border-box}
textarea{min-height:120px;margin-top:8px}
.msg{margin-top:10px;color:#94a3b8;white-space:pre-wrap}
.item{background:#0f172a;border-radius:8px;padding:10px;margin-top:8px}
.item b{display:block}
.item small{color:#94a3b8}
.row{display:flex;gap:8px;margin-top:8px}
.row button{flex:1;border:0;border-radius:6px;padding:8px;background:#334155;color:#fff}
.warn{font-size:12px;color:#94a3b8;margin-top:8px}
</style>
</head>
<body>
<div class="wrap">
<h1>📦 圧縮＋便利帖</h1>
<p class="sub">題名をつけて書けます。開くと上に再表示します。</p>
<div class="tab"><button class="on" id="t1">ZIP</button><button id="t2">動画</button><button id="t3">メモ</button></div>
<div class="card">
<div id="p1">
<div class="drop" id="zdrop">ファイルを選ぶ</div>
<input id="zin" type="file" multiple hidden>
<p id="zlist"></p>
<button class="main" id="zbtn" disabled>ZIPを作る</button>
</div>
<div id="p2" style="display:none">
<div class="drop" id="vdrop">動画を選ぶ</div>
<input id="vin" type="file" accept="video/*" hidden>
<p id="vinfo"></p>
<button class="main" id="vbtn" disabled>動画を圧縮</button>
</div>
<div id="p3" style="display:none">
<p id="nowopen" class="warn">新しいメモ</p>
<input id="ntitle" placeholder="題名">
<textarea id="nbody" placeholder="ここに書く"></textarea>
<button class="main" id="npick">動画を付ける</button>
<input id="nvid" type="file" accept="video/*" hidden>
<p id="nvidname" class="warn"></p>
<button class="main green" id="nsave">メモを保存</button>
<button class="main" id="nnew">新しいメモ</button>
<div id="nlist"></div>
</div>
<a id="dl" class="main green" style="display:none;text-align:center;text-decoration:none;margin-top:12px" href="#">ダウンロード</a>
<p class="msg" id="msg"></p>
</div>
</div>
<script>
const $=id=>document.getElementById(id);
let zfiles=[], vfile=null, ready='', noteVid=null;
function fmt(n){ if(n<1024)return n+' B'; if(n<1048576)return (n/1024).toFixed(1)+' KB'; return (n/1048576).toFixed(2)+' MB'; }
function say(t){ $('msg').textContent=t; }
function showTab(n){ [1,2,3].forEach(i=>{ $('t'+i).className=i===n?'on':''; $('p'+i).style.display=i===n?'block':'none'; }); if(n===3) renderNotes(); }
$('t1').onclick=()=>showTab(1); $('t2').onclick=()=>showTab(2); $('t3').onclick=()=>showTab(3);
function setDL(blob,name){ if(ready) URL.revokeObjectURL(ready); ready=URL.createObjectURL(blob); const a=$('dl'); a.href=ready; a.download=name; a.style.display='block'; a.textContent='⬇️ '+name; }
function dbp(){ return new Promise((res,rej)=>{ const r=indexedDB.open('locker',1); r.onupgradeneeded=()=>r.result.createObjectStore('notes',{keyPath:'id'}); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }); }
async function allNotes(){ const db=await dbp(); return new Promise((res,rej)=>{ const q=db.transaction('notes').objectStore('notes').getAll(); q.onsuccess=()=>res(q.result||[]); q.onerror=()=>rej(q.error); }); }
async function putNote(n){ const db=await dbp(); return new Promise((res,rej)=>{ const q=db.transaction('notes','readwrite').objectStore('notes').put(n); q.onsuccess=()=>res(); q.onerror=()=>rej(q.error); }); }
async function delNote(id){ const db=await dbp(); return new Promise((res,rej)=>{ const q=db.transaction('notes','readwrite').objectStore('notes').delete(id); q.onsuccess=()=>res(); q.onerror=()=>rej(q.error); }); }
function openNote(n){
  showTab(3);
  $('ntitle').value=n.title||'';
  $('nbody').value=n.body||'';
  noteVid=n.blob?n.blob:null;
  $('nvidname').textContent=n.fileName?('動画: '+n.fileName):'';
  $('nowopen').textContent='開いている: '+(n.title||'無題');
  say('開きました: '+(n.title||'無題'));
  window.scrollTo(0,0);
}
async function renderNotes(){
  let list=[]; try{ list=await allNotes(); }catch(e){ $('nlist').textContent='読めません'; return; }
  list.sort((a,b)=>b.id-a.id);
  $('nlist').innerHTML=list.length?'':'<p class="warn">まだありません</p>';
  list.forEach(n=>{
    const d=document.createElement('div'); d.className='item';
    const b=document.createElement('b'); b.textContent=n.title||'無題';
    const s=document.createElement('small'); s.textContent=(n.body||'').slice(0,80);
    const row=document.createElement('div'); row.className='row';
    const o=document.createElement('button'); o.textContent='開く'; o.onclick=e=>{ e.stopPropagation(); openNote(n); };
    const rm=document.createElement('button'); rm.textContent='消す'; rm.onclick=async e=>{ e.stopPropagation(); if(confirm('消す?')){ await delNote(n.id); renderNotes(); } };
    d.onclick=()=>openNote(n);
    row.appendChild(o); row.appendChild(rm); d.appendChild(b); d.appendChild(s); d.appendChild(row); $('nlist').appendChild(d);
  });
}
$('zdrop').onclick=()=>$('zin').click();
$('zin').onchange=()=>{ zfiles=[...$('zin').files]; $('zlist').textContent=zfiles.map(f=>f.name).join(', '); $('zbtn').disabled=!zfiles.length; };
$('zbtn').onclick=async()=>{ try{ const zip=new JSZip(); zfiles.forEach(f=>zip.file(f.name,f)); const blob=await zip.generateAsync({type:'blob',compression:'DEFLATE'}); setDL(blob,'compressed.zip'); say('ZIPできました '+fmt(blob.size)); }catch(e){ say(String(e)); } };
$('vdrop').onclick=()=>$('vin').click();
$('vin').onchange=()=>{ vfile=$('vin').files[0]; $('vinfo').textContent=vfile?vfile.name:''; $('vbtn').disabled=!vfile; };
$('vbtn').onclick=async()=>{ if(!vfile) return; say('圧縮は手順が重いので、まずこのファイルをメモに保存できます'); $('ntitle').value=vfile.name; noteVid=vfile; $('nvidname').textContent='動画: '+vfile.name; showTab(3); };
$('npick').onclick=()=>$('nvid').click();
$('nvid').onchange=()=>{ noteVid=$('nvid').files[0]; $('nvidname').textContent=noteVid?('動画: '+noteVid.name):''; };
$('nnew').onclick=()=>{ $('ntitle').value=''; $('nbody').value=''; noteVid=null; $('nvidname').textContent=''; $('nowopen').textContent='新しいメモ'; };
$('nsave').onclick=async()=>{ const title=$('ntitle').value.trim(); const body=$('nbody').value; if(!title&&!body&&!noteVid){ say('題名を書いてください'); return; } try{ await putNote({id:Date.now(),title:title||'無題',body,fileName:noteVid&&noteVid.name||'',blob:noteVid||null}); say('保存しました'); renderNotes(); }catch(e){ say('保存失敗'); } };
renderNotes();
</script>
</body>
</html>
